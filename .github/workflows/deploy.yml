name: Deploy Changed Files to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Files
        id: changed-files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt
          cat changed_files.txt

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Changed Files
        run: |
          while IFS= read -r file
          do
            if [ -f "$file" ]; then

              echo "Uploading: $file"

              ssh -i ~/.ssh/id_rsa \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                "mkdir -p /home/user/web/psnf.upparac.com/public_html/erpv2/$(dirname "$file")"

              scp -i ~/.ssh/id_rsa \
                "$file" \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/user/web/psnf.upparac.com/public_html/erpv2/"$file"

            fi
          done < changed_files.txt