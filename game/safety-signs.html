<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Safety Sign Recognition educational game." />
  <title>PSNF | Safety Signs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="safety-signs.css" />
  <link rel="stylesheet" href="voice-settings.css" />
</head>
<body>
  <div class="app-shell">
    <header class="game-header glass-card">
      <div class="header-left">
        <a class="back-btn" href="index.html" aria-label="Back to home">←</a>
        <div>
          <h1>Safety Signs</h1>
          <p>Learn important safety signs</p>
          <p id="audioSubtitle" class="audio-subtitle" aria-live="polite"></p>
        </div>
      </div>
      <button id="resetTopBtn" class="top-icon-btn" type="button" aria-label="Reload page" title="Reload page">↻</button>
      <div class="stats-row">
        <article class="stat-card"><span class="stat-icon">⭐</span><div><strong id="starsCount">0</strong><small>Stars</small></div></article>
        <article class="stat-card"><span class="stat-icon">XP</span><div class="xp-wrap"><strong><span id="xpCount">0</span> / 500</strong><small>XP</small><div class="xp-track"><div id="xpFill" class="xp-fill"></div></div></div></article>
        <article class="stat-card"><span class="stat-icon">🏅</span><div><strong id="levelCount">1</strong><small>Level</small></div></article>
        <button id="listenBtn" class="stat-card listen-card" type="button"><span class="stat-icon">🔊</span><div><strong>Listen</strong><small>Repeat prompt</small></div></button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel-col left-col">
        <article class="card-base"><h2>Question</h2><p class="label">Find:</p><p id="questionText" class="question-text">HOSPITAL SIGN</p></article>
        <article class="card-base"><h2>Time Left</h2><p id="timerText" class="timer-text">01:30</p></article>
        <article class="card-base"><h2>Hint</h2><p id="hintText" class="hint-text">This sign helps people find medical care.</p></article>
        <article class="card-base"><h2>Progress</h2><p class="progress-text">Round: <strong id="roundText">1 / 10</strong></p></article>
      </aside>

      <section class="center-col card-base">
        <h2>Choose the correct sign</h2>
        <div id="signGrid" class="sign-grid" aria-live="polite"></div>
      </section>

      <aside class="panel-col right-col">
        <article class="card-base"><h2>Rounds</h2><ul id="roundsList" class="rounds-list"></ul></article>
        <article class="card-base"><h2>Tip</h2><p class="hint-text">Look carefully before selecting.</p></article>
        <article class="card-base button-stack">
          <button id="checkBtn" class="action-btn success" type="button">Check</button>
          <button id="hintBtn" class="action-btn outline" type="button">Hint</button>
        </article>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
  </div>

  <script src="voice-settings.js"></script>
  <script src="safety-signs.js"></script>
</body>
</html>
